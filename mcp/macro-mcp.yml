generated: '2026-07-20'
method: searched
source: https://docs.macro.com/AI/mcp/overview.md
name: Macro MCP Server
type: MCPServer
status: official
description: >-
  Official hosted (remote) MCP server for Macro, the unified interface for email,
  messages, tasks, calls, agents, pull requests, docs and CRM linked together with
  shared AI memory. Lets AI clients read and act across a connected Macro workspace.
endpoint: https://mcp-server.macro.com/mcp
transport: http
authentication:
  type: oauth2
  flow: browser
  notes: >-
    Authentication happens through Macro's OAuth flow when the client connects; the
    user completes a browser sign-in during the initial connection. MCP access is
    included on all Macro plans, including the free plan.
docs: https://docs.macro.com/AI/mcp/overview.md
tool_reference: https://docs.macro.com/AI/mcp/tools/index.md
install:
  claude_code: claude mcp add --transport http macro https://mcp-server.macro.com/mcp
  codex_cli: codex mcp add macro --url https://mcp-server.macro.com/mcp
  json_config: |
    {
      "macro": {
        "type": "http",
        "url": "https://mcp-server.macro.com/mcp"
      }
    }
