aid: macro
name: Macro
description: >-
  Macro is an all-in-one, keyboard-first work operating system that unifies email,
  team messages, documents, tasks, calls, agents, GitHub pull requests and CRM into a
  single fast database, linked together by @mentions and a shared AI memory. Backed by
  a16z and built in the open (AGPLv3, github.com/macro-inc/macro), Macro runs on AWS,
  is SOC 2 Type II audited, and exposes an official hosted Model Context Protocol (MCP)
  server so AI clients can search, read and act across a connected workspace.
